[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wps-office-mcp"
version = "2.0.0"
description = "MCP server for WPS Office automation — Writer / Calc / Impress control, live typing, PDF export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeepDepCat Team" }]
keywords = ["mcp", "wps", "office", "automation", "agent", "com"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywin32>=306",
    "click>=8.0",
    "mcp>=1.0.0",
]

[project.scripts]
wps-cli = "wps_controller.wps_cli:main"
wps-mcp = "wps_controller.mcp_server:main"

[tool.setuptools.packages.find]
include = ["wps_controller*"]
